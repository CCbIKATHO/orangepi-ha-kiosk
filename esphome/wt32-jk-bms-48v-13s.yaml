# firmware build trigger
substitutions:
  device_name: jk-bms-48v
  friendly_name: "JK BMS 48V 13S"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "JK-BMS 48V 13S UART -> WT32-ETH01 Ethernet -> ESPHome Native API"
  project:
    name: "lan-line.jk-bms-dashboard"
    version: "1.0"

esp32:
  board: wt32-eth01
  framework:
    type: arduino

external_components:
  - source: github://syssi/esphome-jk-bms@main
    refresh: 0s

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key_48v

ota:
  - platform: esphome

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO16

uart:
  - id: uart_bms
    baud_rate: 115200
    rx_buffer_size: 384
    tx_pin: GPIO4
    rx_pin: GPIO35

jk_modbus:
  - id: modbus_bms
    uart_id: uart_bms
    rx_timeout: 50ms

jk_bms:
  - id: bms
    jk_modbus_id: modbus_bms
    update_interval: 5s

binary_sensor:
  - platform: jk_bms
    balancing:
      name: "Balancing"
    balancing_switch:
      name: "Balancing Switch"
    charging:
      name: "Charging"
    discharging:
      name: "Discharging"
    dedicated_charger_switch:
      name: "Dedicated Charger Switch"
    online_status:
      name: "BMS Online"

sensor:
  - platform: jk_bms
    cell_voltage_1:
      name: "Cell 1 Voltage"
    cell_voltage_2:
      name: "Cell 2 Voltage"
    cell_voltage_3:
      name: "Cell 3 Voltage"
    cell_voltage_4:
      name: "Cell 4 Voltage"
    cell_voltage_5:
      name: "Cell 5 Voltage"
    cell_voltage_6:
      name: "Cell 6 Voltage"
    cell_voltage_7:
      name: "Cell 7 Voltage"
    cell_voltage_8:
      name: "Cell 8 Voltage"
    cell_voltage_9:
      name: "Cell 9 Voltage"
    cell_voltage_10:
      name: "Cell 10 Voltage"
    cell_voltage_11:
      name: "Cell 11 Voltage"
    cell_voltage_12:
      name: "Cell 12 Voltage"
    cell_voltage_13:
      name: "Cell 13 Voltage"

    min_cell_voltage:
      name: "Min Cell Voltage"
    max_cell_voltage:
      name: "Max Cell Voltage"
    min_voltage_cell:
      name: "Min Voltage Cell"
    max_voltage_cell:
      name: "Max Voltage Cell"
    delta_cell_voltage:
      name: "Cell Voltage Delta"
    average_cell_voltage:
      name: "Average Cell Voltage"

    mosfet_temperature:
      name: "MOS Temperature"
    temperature_sensor_1:
      name: "Battery Temperature 1"
    temperature_sensor_2:
      name: "Battery Temperature 2"

    total_voltage:
      name: "Battery Voltage"
    current:
      name: "Battery Current"
    power:
      name: "Battery Power"
    charging_power:
      name: "Charging Power"
    discharging_power:
      name: "Discharging Power"
    state_of_charge:
      name: "State of Charge"
    capacity_remaining:
      name: "Capacity Remaining"
    charging_cycles:
      name: "Charging Cycles"
    cell_count:
      name: "Cell Count"
    errors_bitmask:
      name: "Errors Bitmask"
    total_runtime:
      name: "Total Runtime"

switch:
  - platform: jk_bms
    charging:
      name: "Charging Switch"
    discharging:
      name: "Discharging Switch"

text_sensor:
  - platform: jk_bms
    errors:
      name: "Errors"
    operation_mode:
      name: "Operation Mode"
    battery_type:
      name: "Battery Type"
    software_version:
      name: "Software Version"
    manufacturer:
      name: "Manufacturer"
    total_runtime_formatted:
      name: "Total Runtime Formatted"
